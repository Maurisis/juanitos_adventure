<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juanito's Journey to Exactas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #0a0e0c;
    --panel:     #10171388;
    --panel-solid:#0f1613;
    --line:      #1f2e27;
    --green:     #4ade80;
    --green-dim: #2f7a52;
    --amber:     #f5c451;
    --red:       #f4685e;
    --text:      #cfe8d9;
    --text-dim:  #7fa08d;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --pixel: 'Press Start 2P', var(--mono);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 16px 64px;
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanline + vignette overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0.0) 0px,
        rgba(0,0,0,0.0) 2px,
        rgba(0,0,0,0.18) 3px,
        rgba(0,0,0,0.0) 4px
      );
    mix-blend-mode: multiply;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 51;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.86; }
    94% { opacity: 1; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .terminal { animation: flicker 7s infinite; }
  }

  .terminal {
    width: 100%;
    max-width: 720px;
    background: var(--panel-solid);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 0 0 1px #000, 0 20px 60px -20px rgba(0,0,0,0.8), 0 0 40px -10px rgba(74,222,128,0.08);
    overflow: hidden;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #0c1310;
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #2a3530; }
  .titlebar .path {
    margin-left: 8px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .screen {
    padding: 28px 28px 32px;
  }

  .game-title {
    font-family: var(--pixel);
    font-size: 15px;
    line-height: 1.8;
    color: var(--green);
    text-shadow: 0 0 12px rgba(74,222,128,0.35);
    margin: 0 0 6px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin: 0 0 22px;
    letter-spacing: 0.02em;
  }

  /* progress */
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .progress-bar {
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--green-dim);
  }
  .progress-bar .filled { color: var(--green); }

  .subject-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid var(--green-dim);
    border-radius: 4px;
    color: var(--green);
    margin-bottom: 14px;
  }
  .subject-tag.chem { border-color: #c98bf0; color: #c98bf0; }
  .subject-tag.phys { border-color: #66b8f2; color: #66b8f2; }

  pre.ascii {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.25;
    color: var(--green-dim);
    background: #081009;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 12px;
    overflow-x: auto;
    margin: 0 0 18px;
    text-shadow: 0 0 6px rgba(74,222,128,0.15);
  }

  .story {
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--text);
    margin: 0 0 20px;
    white-space: pre-line;
  }

  .question {
    font-size: 14.5px;
    color: var(--amber);
    margin: 0 0 16px;
    line-height: 1.5;
  }
  .question::before { content: "> "; color: var(--green); }

  .options {
    display: grid;
    gap: 10px;
    margin-bottom: 8px;
  }
  .opt {
    text-align: left;
    background: #0c1512;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--green-dim);
    background: #0e1a15;
  }
  .opt:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
  .opt:active:not(:disabled) { transform: translateY(1px); }
  .opt .letter {
    color: var(--green-dim);
    margin-right: 10px;
  }
  .opt:disabled { cursor: default; opacity: 0.6; }
  .opt.correct {
    border-color: var(--green);
    background: rgba(74,222,128,0.08);
    opacity: 1;
  }
  .opt.wrong {
    border-color: var(--red);
    background: rgba(244,104,94,0.08);
    opacity: 1;
  }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good {
    border: 1px solid var(--green-dim);
    background: rgba(74,222,128,0.06);
    color: var(--text);
  }
  .feedback.good .label { color: var(--green); font-weight: 600; }
  .feedback.bad {
    border: 1px solid var(--red);
    background: rgba(244,104,94,0.07);
    color: var(--text);
  }
  .feedback.bad .label { color: var(--red); font-weight: 600; }

  .actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .btn {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--green-dim);
    background: transparent;
    color: var(--green);
    transition: background .15s ease, color .15s ease;
  }
  .btn:hover { background: var(--green); color: #06120b; }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: var(--red); color: #1a0806; }
  .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .end-title {
    font-family: var(--pixel);
    font-size: 15px;
    margin: 0 0 16px;
    line-height: 1.7;
  }
  .end-title.good { color: var(--green); text-shadow: 0 0 12px rgba(74,222,128,0.4);}
  .end-title.bad  { color: var(--red);   text-shadow: 0 0 12px rgba(244,104,94,0.4);}

  .footer-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 18px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .screen { padding: 20px 16px 26px; }
    .game-title { font-size: 12px; }
    pre.ascii { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="titlebar">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="path">campus_corridor.exe — 09:41 AM</div>
  </div>
  <div class="screen" id="screen"></div>
</div>

<script>
(function(){

  const LEVELS = [
    {
      subject: "math",
      subjectLabel: "Math",
      ascii:
`      _____________
     |  MAIN GATE  |
     |   [_][_][_] |
     |   [_][_][_] |
     |_____________|
        |       |
     ___|_______|___
    /   KEYPAD LOCK  \\`,
      story: "It is 7:58 in the morning. Juanito is running to the university gate. The exam info session starts at 8:00. This gate is the only way in. A keypad locks the door. A note on the wall says: \"Code = sum of the first three prime numbers.\"",
      question: "What number should Juanito type?",
      options: ["8", "9", "10", "12"],
      correct: 2,
      good: "Juanito thinks about it: 2 + 3 + 5 = 10. He types 10. The gate opens with a click. He still has two minutes before the session starts.",
      bad: "Juanito types the wrong number. The keypad turns red and locks for ten minutes. Now Juanito is stuck outside, and he watches the clock move past 8:00 through the bars of the gate."
    },
    {
      subject: "physics",
      subjectLabel: "Physics",
      ascii:
`   [ELEVATOR: OUT OF ORDER]
        ___
       | X |
       |___|
        | |
     ___|_|___
    STAIRWELL B
     240 m to go`,
      story: "The elevator is broken. Juanito must run 100 meters to reach the stairs. He has only 30 seconds before the doors close. He can run at 5 meters per second.",
      question: "How many seconds does Juanito need to run 100 meters at 5 meters per second? Does he make it in 30 s?",
      options: ["20 s — yes, he has time", "30 s — just in time", "35 s — too slow", "50 s — too slow"],
      correct: 0,
      good: "Time = distance ÷ speed = 100 ÷ 5 = 20 seconds. Juanito still has 10 extra seconds. He runs to the stairs and reaches the door right before it closes.",
      bad: "Juanito guesses wrong and thinks he is too slow, so he stops running. He arrives after the doors are already closed."
    },
    {
      subject: "chemistry",
      subjectLabel: "Chemistry",
      ascii:
`   ~~~~ SPILL ~~~~
   ░░░░░░░░░░░░░░░
   ░░ [litmus] ░░░
   ░░  strip:  ░░░
   ░░   RED    ░░░
   ░░░░░░░░░░░░░░░`,
      story: "Near the chemistry room, a bottle has spilled clear liquid on the floor. A paper strip in the liquid turns bright red. Juanito needs to know if it is safe to walk through.",
      question: "A red paper strip means the liquid is...",
      options: ["basic (pH 8–14)", "neutral (pH 7)", "not related to pH", "acidic (pH 0–6)"],
      correct: 3,
      good: "Red means the liquid is acidic, around pH 0 to 6. That is not safe for his shoes. Juanito walks around the puddle, along the dry part of the floor, and keeps going.",
      bad: "Juanito thinks the color does not matter and walks through the puddle. The acid damages his shoe, so he must stop at the nurse's office to rinse his foot. He loses all his extra time."
    },
    {
      subject: "math",
      subjectLabel: "Math",
      ascii:
`   [VENDING MACHINE]
    ___________
   |  $ 3.60   |
   |  PAID $5  |
   |  ERROR:   |
   |  3/4 CHNG |
   |___________|`,
      story: "Juanito buys a coffee for $2. He pays with a $5 bill. A sign on the machine says: \"This machine gives only half of your change.\"",
      question: "The full change is $3. How much money does the machine actually give Juanito?",
      options: ["$3.00", "$1.50", "$2.00", "$1.00"],
      correct: 1,
      good: "Half of $3 is $1.50. Juanito takes the $1.50, does not argue with the machine, and keeps walking with his coffee.",
      bad: "Juanito expects the full $3 and argues with the machine instead of walking away. He wastes time, and the clock keeps running."
    },
    {
      subject: "physics",
      subjectLabel: "Physics",
      ascii:
`   |==================|
   |   FALLEN SHELF    |
   |   mass = 50 kg    |
   |===[BLOCKING]======|
        corridor`,
      story: "A shelf is blocking the hallway. It has a mass of 10 kg. Juanito must push it so it moves with an acceleration of 2 meters per second squared.",
      question: "Using F = m × a, how much force does Juanito need to push the shelf?",
      options: ["12 N", "5 N", "20 N", "200 N"],
      correct: 2,
      good: "F = m × a = 10 × 2 = 20 N. Juanito pushes with the right amount of force. The shelf slides aside and opens a path for him.",
      bad: "Juanito pushes too hard without thinking. The shelf tips over and blocks the hallway completely, and campus security comes to check the noise."
    },
    {
      subject: "math",
      subjectLabel: "Math",
      ascii:
`   [SECURITY PANEL]
    ___________
   |  2x + 5   |
   |    =17    |
   |  x = ??   |
   |___________|`,
      story: "A locked door has a small screen with a math problem. Only the right answer will open the door.",
      question: "Solve for x: 2x + 4 = 10.",
      options: ["x = 3", "x = 4", "x = 2", "x = 5"],
      correct: 0,
      good: "2x + 4 = 10  →  2x = 6  →  x = 3. Juanito types \"3\" and the screen turns green. The door opens onto a shortcut he did not know about.",
      bad: "Juanito guesses without solving the problem. The screen turns red and a timer starts counting down — time he does not have."
    },
    {
      subject: "chemistry",
      subjectLabel: "Chemistry",
      ascii:
`  LAB SPILL - AISLE 3
  [ACID: 2 mol]
  [BASE avail: NaHCO3]
   fizz... fizz...`,
      story: "In the lab, 3 moles of acid have spilled on the floor. Juanito has baking soda, which is a base. Acid and base react in a 1:1 ratio.",
      question: "How many moles of base does Juanito need to stop the acid?",
      options: ["6 mol", "1 mol", "1.5 mol", "3 mol"],
      correct: 3,
      good: "With a 1:1 ratio, 3 mol of acid needs 3 mol of base. Juanito adds the right amount of baking soda, and the spill stops fizzing.",
      bad: "Juanito adds too little baking soda. The acid is still active, so he must go back and find another way to Exactas."
    },
    {
      subject: "math",
      subjectLabel: "Math",
      ascii:
`   [AIR DUCT ACCESS]
    ___________
   /  0.5 m   /|
  /__________/ |
  |          | / 0.4 m
  |__________|/
   min. area:
   0.18 m² req.`,
      story: "Juanito finds an open duct. It is 1 meter wide and 0.5 meters tall. A sign says the duct must be at least 0.3 square meters to be safe.",
      question: "What is the area of the duct? Is it big enough?",
      options: ["1.5 m² — yes, big enough", "0.5 m² — yes, big enough", "0.2 m² — too small", "5 m² — yes, big enough"],
      correct: 1,
      good: "Area = width × height = 1 × 0.5 = 0.5 m², which is bigger than 0.3 m². Juanito crawls through the duct with no problem and comes out the other side.",
      bad: "Juanito does not check the size before he tries to crawl through. Halfway in, he gets stuck, and a maintenance worker has to help pull him out."
    },
    {
      subject: "physics",
      subjectLabel: "Physics",
      ascii:
`   [OLD FREIGHT LIFT]
     counterweight:
     bucket, 20 kg
     drop height: 3 m
        ||
      __||__
     |PULLEY|`,
      story: "An old lift uses a falling weight to go up. The weight is 10 kg and falls 2 meters. Juanito wants to know how much energy this gives.",
      question: "Using PE = m × g × h, with g ≈ 10 m/s², how much energy does the falling weight give?",
      options: ["20 J", "100 J", "200 J", "2000 J"],
      correct: 2,
      good: "PE = m × g × h = 10 × 10 × 2 = 200 J. That is enough energy. Juanito releases the weight, and the lift rises smoothly with him on it.",
      bad: "Juanito does not check the energy first. The lift is too weak and stalls halfway up. Juanito has to climb out and find another way."
    },
    {
      subject: "math",
      subjectLabel: "Math",
      ascii:
`   ___________________
  |     E X A C T A S   |
  |     _____________   |
  |    | DOOR CODE:  |  |
  |    | x²-5x+6 = 0 |  |
  |    | take larger |  |
  |    |   root      |  |
  |    |_____________|  |
  |___________________|`,
      story: "Juanito reaches the big doors of the Exactas building. Through the glass he can see the room filling up. A screen shows one last math problem: the code is the larger value of x² − 5x + 6 = 0.",
      question: "Solve x² − 5x + 6 = 0. What is the larger value of x?",
      options: ["x = 3", "x = 2", "x = 1", "x = 6"],
      correct: 0,
      good: "Factoring: x² − 5x + 6 = (x − 2)(x − 3) = 0, so x = 2 or x = 3. The larger value is 3. Juanito enters \"3\" and the doors open just as the proctor starts to speak.",
      bad: "Juanito enters the wrong number. The doors stay shut. Through the glass, he watches the session start without him."
    }
  ];

  const screen = document.getElementById('screen');
  let current = 0;

  function progressBar(levelIndex){
    const total = LEVELS.length;
    let bar = '';
    for(let i=0;i<total;i++){
      bar += i < levelIndex ? '<span class="filled">■</span>' : '□';
    }
    return bar;
  }

  function subjectClass(subject){
    if(subject === 'chemistry') return 'chem';
    if(subject === 'physics') return 'phys';
    return '';
  }

  function renderIntro(){
    screen.innerHTML = `
      <h1 class="game-title">JUANITO'S JOURNEY<br>TO EXACTAS</h1>
      <p class="subtitle">a 10-level campus adventure — math · physics · chemistry</p>
      <pre class="ascii">        .-""""""-.
       /  o    o  \\
      |     __     |      7:57 AM.
      |    '  '    |      Juanito is late.
       \\   ----   /       Exactas is far.
        '-.____.-'        The clock is not on his side.
         /|    |\\
        / |    | \\
          |    |
         _|    |_
        [________]</pre>
      <p class="story">Ten obstacles stand between Juanito and the Exactas lecture hall. Each one needs a number to solve it — some math, some physics, some chemistry. Answer correctly, and Juanito moves forward. Answer wrong, and the story ends there.</p>
      <div class="actions">
        <button class="btn" id="startBtn">&gt; Start the run</button>
      </div>
    `;
    document.getElementById('startBtn').addEventListener('click', () => {
      current = 0;
      renderLevel();
    });
  }

  function renderLevel(){
    const lvl = LEVELS[current];
    screen.innerHTML = `
      <div class="progress-row">
        <span>LEVEL ${current+1} / ${LEVELS.length}</span>
        <span class="progress-bar">${progressBar(current)}</span>
      </div>
      <span class="subject-tag ${subjectClass(lvl.subject)}">${lvl.subjectLabel}</span>
      <pre class="ascii">${lvl.ascii}</pre>
      <p class="story">${lvl.story}</p>
      <p class="question">${lvl.question}</p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions" id="actions"></div>
    `;

    const optionsEl = document.getElementById('options');
    const letters = ['A','B','C','D'];
    lvl.options.forEach((optText, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = `<span class="letter">${letters[idx]}</span>${optText}`;
      btn.addEventListener('click', () => handleAnswer(idx));
      optionsEl.appendChild(btn);
    });
  }

  function handleAnswer(idx){
    const lvl = LEVELS[current];
    const optionButtons = document.querySelectorAll('#options .opt');
    optionButtons.forEach(b => b.disabled = true);

    const isCorrect = idx === lvl.correct;
    optionButtons[idx].classList.add(isCorrect ? 'correct' : 'wrong');
    if(!isCorrect){
      optionButtons[lvl.correct].classList.add('correct');
    }

    const feedback = document.getElementById('feedback');
    const actions = document.getElementById('actions');

    if(isCorrect){
      feedback.className = 'feedback show good';
      feedback.innerHTML = `<span class="label">Correct.</span> ${lvl.good}`;
      const isLast = current === LEVELS.length - 1;
      actions.innerHTML = `<button class="btn" id="nextBtn">${isLast ? '&gt; Reach Exactas' : '&gt; Keep going'}</button>`;
      document.getElementById('nextBtn').addEventListener('click', () => {
        if(isLast){
          renderGoodEnding();
        } else {
          current++;
          renderLevel();
        }
      });
    } else {
      feedback.className = 'feedback show bad';
      feedback.innerHTML = `<span class="label">Wrong.</span> ${lvl.bad}`;
      actions.innerHTML = `<button class="btn danger" id="endBtn">&gt; See how it ends</button>`;
      document.getElementById('endBtn').addEventListener('click', () => {
        renderBadEnding(lvl, current);
      });
    }
  }

  function renderBadEnding(lvl, levelIndex){
    screen.innerHTML = `
      <div class="progress-row">
        <span>LEVEL ${levelIndex+1} / ${LEVELS.length}</span>
        <span class="progress-bar">${progressBar(levelIndex)}</span>
      </div>
      <h2 class="end-title bad">GAME OVER</h2>
      <pre class="ascii">   .-""""""-.
  /  x    x  \\
 |     __     |     Session started
 |    '  '    |     without him.
  \\   ----   /
   '-.____.-'
    /|    |\\
   / |    | \\</pre>
      <p class="story">${lvl.bad}</p>
      <p class="story">Juanito's journey to Exactas ends here — for today, at least.</p>
      <div class="actions">
        <button class="btn" id="retryBtn">&gt; Try again</button>
      </div>
      <p class="footer-note">Bad ending reached at Level ${levelIndex+1}: ${lvl.subjectLabel}</p>
    `;
    document.getElementById('retryBtn').addEventListener('click', renderIntro);
  }

  function renderGoodEnding(){
    screen.innerHTML = `
      <div class="progress-row">
        <span>LEVEL ${LEVELS.length} / ${LEVELS.length}</span>
        <span class="progress-bar">${progressBar(LEVELS.length)}</span>
      </div>
      <h2 class="end-title good">JUANITO MADE IT</h2>
      <pre class="ascii">   ___________________
  |     E X A C T A S   |
  |    ______________   |
  |   |   welcome    |  |
  |   |   juanito    |  |
  |   |______________|  |
  |___________________|
        \\o/
         |      right on time.
        / \\</pre>
      <p class="story">The doors close behind him. Juanito sits down in the last open seat just as the proctor says "Good morning, everyone." He is out of breath, but nobody notices.</p>
      <p class="story">Ten obstacles, ten right answers: a locked gate, a race against time, a spill to avoid, tricky change, a shelf to push, a coded door, an acid to neutralize, a duct to measure, a lift to power, and one final equation. Math, physics, and chemistry got him here — not luck.</p>
      <div class="actions">
        <button class="btn" id="playAgainBtn">&gt; Play again</button>
      </div>
    `;
    document.getElementById('playAgainBtn').addEventListener('click', renderIntro);
  }

  renderIntro();
})();
</script>

</body>
</html>
